<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Image Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Optional: light background for contrast */
        }
        img {
            max-width: 100%;
            height: auto;
            border: 2px solid #333; /* Optional: subtle border for style */
        }
        .error-message {
            color: red;
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <img id="randomImage" src="" alt="A randomly selected photo">
    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <script>
        // Image filenames with paths (adjust based on your directory structure)
        const imageFiles = [
            'images/8rbHkU4-Ttyegzr17BJeWg.png',
            'images/unnamed.png',
            'images/IMG_7476.png'
        ];

        // Optional: Descriptive alt texts for accessibility
        const altTexts = {
            '8rbHkU4-Ttyegzr17BJeWg.png': 'Abstract digital artwork',
            'unnamed.png': 'Scenic landscape photo',
            'IMG_7476.png': 'Portrait of a person'
        };

        window.onload = function() {
            const errorMessage = document.getElementById('errorMessage');
            if (imageFiles.length === 0) {
                errorMessage.textContent = 'No images available.';
                errorMessage.style.display = 'block';
                return;
            }

            const randomIndex = Math.floor(Math.random() * imageFiles.length);
            const imagePath = imageFiles[randomIndex];
            const imageElement = document.getElementById('randomImage');
            
            // Set image source and alt text
            imageElement.src = imagePath;
            imageElement.alt = altTexts[imagePath.split('/').pop()] || 'A randomly selected photo';

            // Handle image load errors
            imageElement.onerror = function() {
                imageElement.style.display = 'none';
                errorMessage.textContent = 'Failed to load image. Please check the file path.';
                errorMessage.style.display = 'block';
            };
        };
    </script>
</body>
</html>
