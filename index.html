<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I love u vurnul</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      display: none;
    }

    video.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="overlay">click here vurnul</div>

  <video id="video" loop playsinline>
    <source src="assets/intro.mp4" type="video/mp4" />

  </video>
