<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>i love u vurnul</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      cursor: pointer;
      z-index: 10;
      user-select: none;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      object-position: center;
      background: #000;
      display: none;
    }

    video.show {
      display: block;
    }
  </style>
</head>
<body>
  <div id="overlay">click here vurnul</div>

  <video id="video" src="video.mp4" loop playsinline preload="auto"></video>

  <script>
    const overlay = document.getElementById("overlay");
    const video = document.getElementById("video");

    async function startVideo() {
      video.classList.add("show");
      video.muted = false;
      video.volume = 1;

      try {
        await video.play();
        overlay.style.display = "none";
      } catch (err) {
        try {
          video.muted = true;
          await video.play();
          overlay.style.display = "none";
        } catch (e) {
          alert("Video could not play. Make sure video.mp4 is in the same folder as index.html.");
        }
      }
    }

    overlay.addEventListener("click", startVideo, { once: true });
    overlay.addEventListener("touchstart", startVideo, { once: true });
  </script>
</body>
</html>
